name: TimeTracker
options:
  bundleIdPrefix: com.simonbreidenbach.timetracker
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.14.1"

schemes:
  TimeTracker:
    build:
      targets:
        TimeTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TimeTrackerTests
    archive:
      config: Release

targets:
  TimeTracker:
    type: application
    platform: macOS
    sources:
      - TimeTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TimeTracker/Info.plist
    dependencies:
      - package: SQLite
        product: SQLite
  TimeTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TimeTrackerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TimeTracker
      - package: SQLite
        product: SQLite
